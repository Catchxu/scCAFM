model_source: assets

runtime:
  attention_backend: fa4
  precision:
    model_dtype: fp32
    autocast_dtype: bf16
  fsdp:
    enabled: false

data:
  # Required: set this path or pass --input-h5ad.
  input_h5ad: null
  batch_size: 64
  gradient_accumulation_steps: 1
  num_workers: 0
  pin_memory: true
  drop_last: false
  max_length: 4096
  gene_key: null
  platform_key: null
  species_key: species
  tissue_key: null
  disease_key: disease
  expr_pad_value: 0.0
  condition_defaults:
    species: human
    disease: normal

cell_type_annotation:
  label_key: cell_type
  train_fraction: 0.7
  split_seed: 42
  class_weighting: balanced
  output_dir: results/efm_cell_type_annotation

optimizer:
  name: adamw
  efm_lr: 1.0e-5
  classifier_lr: 1.0e-3
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

scheduler:
  name: cosine_with_warmup
  warmup_ratio: 0.1
  min_lr_ratio: 0.0

trainer:
  epochs: 10
  grad_clip_norm: 1.0
